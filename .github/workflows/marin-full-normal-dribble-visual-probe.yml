name: Marin complete normal-dribble bounce visual probe (diagnostic only)

on:
  push:
    branches:
      - maintenance/pr6-pr7-reconciliation-probe
    paths:
      - '.github/workflows/marin-full-normal-dribble-visual-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro-calibration:
    name: Normal-dribble 30-tick cycle capture, no production writes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed main, sparse and blobless
        uses: actions/checkout@v4
        with:
          ref: 7e700c0eb392800794167007e076c51ac8357a77
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /.github/
            /index.html
            /package.json
            /package-lock.json
            /src/
            /public/
            /tests/
            /tools/*.mjs
            /tools/*.js
            /docs/animation-production/ASSET_AUDIT_LATEST.json
            /docs/animation-production/ASSET_AUDIT_LATEST.md
          sparse-checkout-cone-mode: false

      - name: Assemble original pinned PR6/PR7 checkout in runner only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          p6=55a2ab104d6b108cc08132fddc01b32afb958e75
          p7=97119d54fd24c442c15192a798cae1e8a279eb1d
          git config user.name 'GitHub CI diagnostic'
          git config user.email 'ci-local@example.invalid'
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/codex/captain-animation-completion:refs/remotes/origin/codex/captain-animation-completion' \
            '+refs/heads/codex/issue-7-seven-donor-supporting-reuse:refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse'
          test "$(git rev-parse HEAD)" = 7e700c0eb392800794167007e076c51ac8357a77
          test "$(git rev-parse refs/remotes/origin/codex/captain-animation-completion)" = "$p6"
          test "$(git rev-parse refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse)" = "$p7"
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const base='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const response=await fetch(base+'/pulls/7/files?per_page=100',{headers});
          if(!response.ok) throw Error('PR7 files unavailable: '+response.status);
          const files=await response.json();
          const selected=files.filter(f=>f.status!=='removed'&&/^(src\/|tools\/|tests\/|docs\/animation-production\/ASSET_)/.test(f.filename));
          if(selected.length!==14) throw Error('Unexpected PR7 changed source count '+selected.length);
          for(const file of selected) {
            const response=await fetch(base+'/git/blobs/'+file.sha,{headers});
            if(!response.ok)throw Error('Missing PR7 blob '+file.filename);
            const blob=await response.json();
            const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
            const got=spawnSync('git',['hash-object','-w','--stdin'],{input:bytes,encoding:'utf8'});
            if(got.status!==0||got.stdout.trim()!==file.sha)throw Error('PR7 blob hash mismatch '+file.filename);
          }
          console.log('Hydrated all 14 pinned PR7 source/audit blobs');
          NODE
          git merge --quiet --no-edit --no-ff "$p6"
          set +e
          git merge --no-commit --no-ff "$p7"
          rc=$?
          set -e
          test "$rc" -eq 1
          git diff --name-only --diff-filter=U | sort > /tmp/marin-unmerged.txt
          expected=$(printf 'docs/animation-production/ASSET_AUDIT_LATEST.json\ndocs/animation-production/ASSET_AUDIT_LATEST.md\n')
          test "$(cat /tmp/marin-unmerged.txt)" = "$expected"
          git checkout --ours -- docs/animation-production/ASSET_AUDIT_LATEST.json docs/animation-production/ASSET_AUDIT_LATEST.md
          git add docs/animation-production/ASSET_AUDIT_LATEST.json docs/animation-production/ASSET_AUDIT_LATEST.md
          git commit -qm 'Ephemeral pinned integration only; generated audit excluded from acceptance'
          grep -q 'library.maskProfile,key' src/render/animation-sprites.js
          grep -q 'productionSpriteBaselineOffsetY' src/render/animation-sprites.js
          echo 'Only two known generated-audit conflicts; no remote code was altered.'

      - name: Install EXACT committed Marin candidate source in ephemeral combined checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # PR #7 does not modify animation.js. Abort rather than clobber a new integration change.
          test "$(git hash-object src/core/animation.js)" = d2540e37cc8cb635e3263a54f5794052fd8d6847
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync,readFileSync} from 'node:fs';
          // This is the exact source blob committed to the separate review-only branch.
          const sha='2b1413fce2582fd588f7df111bfb719e8605f046';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Versioned candidate blob unavailable: '+r.status);
          const blob=await r.json();
          const bytes=Buffer.from(blob.content.replace(/\\s/g,''),'base64');
          const verify=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(verify.status!==0||verify.stdout.trim()!==sha)throw Error('Committed candidate blob hash mismatch');
          const source=bytes.toString('utf8');
          if(!source.includes("donorId === 'juniper-vale'"))throw Error('Juniper-only guard missing');
          if(!source.includes("'dribble-run':{forward:[8,9,10,9,8,9,11,10,9,8,8]}"))throw Error('Frame 3/4/5 calibration missing');
          writeFileSync('src/core/animation.js',bytes);
          console.log('Ephemeral integration now uses exact committed review-branch candidate source '+sha);
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          node --input-type=module <<'NODE'
          import {sampleBallForward,sampleBallHeight,athleteBallTrackSource} from './src/core/animation.js';
          import {supportingAnimationLibraries} from './src/content/supporting-animation-libraries.js';
          if(supportingAnimationLibraries['marin-dusk'].donorId!=='juniper-vale')throw Error('Visual donor changed');
          const actual=sampleBallForward('dribble-run',8,'marin-dusk');
          const height=sampleBallHeight('dribble-run',8,'marin-dusk');
          if(actual!==8)throw Error('Frame4 horizontal candidate not active: '+actual);
          const ticks=[4,5,6,7,8,9,10,11,12];
          const observed=ticks.map(t=>sampleBallForward('dribble-run',t,'marin-dusk'));
          const expected=[10,9.5,9,8.5,8,8.5,9,10,11];
          if(observed.some((v,i)=>Math.abs(v-expected[i])>1e-8))throw Error('Full bounce forward samples mismatch: '+observed);
          if(Math.abs(height-.25)>1e-9)throw Error('Bounce height unexpectedly changed: '+height);
          if(athleteBallTrackSource('marin-dusk','dribble-run','forward')!=='marin-dusk')throw Error('Own dribble track not retained');
          for(const clip of ['idle-ball','dribble','dribble-run','receive','pass']){
            if(athleteBallTrackSource('marin-dusk',clip,'forward')!=='marin-dusk')throw Error('Marin action not owned by Marin: '+clip);
          }
          console.log(JSON.stringify({visualDonor:'juniper-vale',clip:'dribble-run',tick:8,frame:4,originalControls:[11,12,12],previousScratchControls:[11,8,12],candidateControls:[9,8,9],bounceSamples:observed,bounceHeight:height}));
          NODE

      - name: Install browser test dependencies
        run: |
          npm ci
          python -m pip install --quiet playwright
          command -v google-chrome

      - name: Capture actual entire normal-dribble cycle, both facings and zooms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/diagnostics
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const sha='0d2b891d6b0fa4f3d3c58e5be7962335627682ad';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const res=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!res.ok)throw Error('Pinned original native gameplay capture harness unavailable '+res.status);
          const blob=await res.json();
          const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
          const hash=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(hash.status!==0||hash.stdout.trim()!==sha)throw Error('Pinned harness SHA mismatch');
          writeFileSync('tools/diagnostics/marin-normal-dribble-full-cycle.py',bytes);
          NODE
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/diagnostics/marin-normal-dribble-full-cycle.py')
          src=p.read_text()
          swaps=[
            ('OUT = ROOT / "tools/generate-art/previews/marin-live-pr6-pr7-scratch"',
              'OUT = ROOT / "tools/generate-art/previews/marin-full-normal-dribble-review"'),
            ('"dribble": {0, 1, 2, 3, 5, 7, 9}',
              '"dribble": {0, 1, 2, 3, 5, 7, 9, 11, 13, 14, 15, 16, 17, 18, 19, 21, 23, 25, 27, 29, 31, 32}'),
            ('for scene in ["idle-ball", "dribble", "dribble-run", "pass-catch"]:',
              'for scene in ["dribble"]:'),
            ('limit = 26 if scene == "pass-catch" else 25 if scene == "idle-ball" else 12',
              'limit = 33'),
            ('if len(REPORT["runs"]) != 16:', 'if len(REPORT["runs"]) != 4:')
          ]
          for a,b in swaps:
              assert src.count(a)==1,('Pinned harness unexpectedly changed',a)
              src=src.replace(a,b)
          # Keep real game simulation, game-registered source art and screen images intact.
          # Record the entire 30-tick loop plus the wrap to tick 31, not just first 8 ticks.
          p.write_text(src)
          PY
          python -m py_compile tools/diagnostics/marin-normal-dribble-full-cycle.py
          python tools/diagnostics/marin-normal-dribble-full-cycle.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('tools/generate-art/previews/marin-full-normal-dribble-review/report.json').read_text())
          assert not report['errors'], report['errors']
          assert len(report['runs'])==4, len(report['runs'])
          capture_steps=[0,1,2,3,5,7,9,11,13,14,15,16,17,18,19,21,23,25,27,29,31,32]
          assert report['screenshotCount']==88,report['screenshotCount']
          directions=set()
          for r in report['runs']:
              assert r['scenario']=='dribble' and r['zoom'] in (100,120)
              facing=r['setup']['facing']
              directions.add((facing,r['zoom']))
              assert [s['step'] for s in r['screenshots']]==capture_steps
              frames=r['frames']
              assert len(frames)==33,len(frames)
              assert frames[0]['marin']['clip']=='idle-ball'
              assert all(f['marin']['clip']=='dribble' for f in frames[1:])
              assert frames[16]['marin']['tick']==15
              assert frames[16]['marin']['atlas']['frame']==5
              assert abs(frames[16]['ball']['z']-frames[16]['marin']['z'])<1e-9
              assert frames[31]['marin']['tick']==30
              assert frames[31]['marin']['atlas']['frame']==0
              assert abs(frames[31]['ball']['z']-frames[31]['marin']['z']-1.2)<1e-9
              for f in frames:
                  assert f['marin']['atlas']['production'] is True
                  assert f['marin']['atlas']['libraryId']=='juniper-vale'
                  assert f['ball']['mode']=='carried' and f['ball']['ownerId']=='marin-dusk'
                  assert abs(f['ball']['x']-f['expectedHandMarin']['x'])<1e-6
              local_x=[(f['ball']['x']-f['marin']['x'])*facing for f in frames[1:]]
              heights=[f['ball']['z']-f['marin']['z'] for f in frames[1:]]
              assert all(abs(local_x[i+1]-local_x[i])<=.335 for i in range(29)),local_x
              assert all(x>=-1e-9 for x in heights),heights
              print('facing',facing,'zoom',r['zoom'],'bounce tick15=0','wrap tick30=1.2','32 gameplay ticks','22 screenshots')
          assert directions=={(1,100),(1,120),(-1,100),(-1,120)}
          print('Verified 88 actual game screenshots; full normal-dribble loop; genuine floor bounce and restart.')
          PY
          {
            echo '## Marin native normal-dribble full-cycle review (NO art acceptance)'
            echo '- Pinned PR6 and PR7 combined in local-only runner, with exact PR16 animation source blob.'
            echo '- 4 direction/zoom cases, 33 frames each, 22 screenshots per case, total 88 PNGs.'
            echo '- Normal dribble floor contact at tick 15 / atlas frame 5 is verified; tick 30 returns to frame 0.'
            echo '- Source sprite registration, ball ownership and horizontal motion consistency verified.'
            echo '- Art contact and live-render timing remain subject to independent pixel-level review.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload normal-dribble full-cycle screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marin-normal-dribble-full-cycle-visual-review
          path: tools/generate-art/previews/marin-full-normal-dribble-review/
          if-no-files-found: error
          retention-days: 7
