name: Diagnose PR 6 + PR 7 reconciliation (no writes)

on:
  pull_request:
    paths:
      - '.github/workflows/pr6-pr7-reconciliation-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-merge-diagnostic:
    name: Read-only Git tree merge diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed main commit, blobless and sparse
        uses: actions/checkout@v4
        with:
          ref: 7e700c0eb392800794167007e076c51ac8357a77
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            src/render
            docs/animation-production
          sparse-checkout-cone-mode: true

      - name: Compare complete Git trees and attempt a local-only virtual merge
        shell: bash
        run: |
          set -euo pipefail
          base=7e700c0eb392800794167007e076c51ac8357a77
          p6=55a2ab104d6b108cc08132fddc01b32afb958e75
          p7=97119d54fd24c442c15192a798cae1e8a279eb1d
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/codex/captain-animation-completion:refs/remotes/origin/codex/captain-animation-completion' \
            '+refs/heads/codex/issue-7-seven-donor-supporting-reuse:refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse'
          test "$(git rev-parse HEAD)" = "$base"
          test "$(git rev-parse refs/remotes/origin/codex/captain-animation-completion)" = "$p6"
          test "$(git rev-parse refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse)" = "$p7"

          original=$(git merge-base "$p6" "$p7")
          git diff --name-only "$original" "$p6" | sort > /tmp/pr6-changes.txt
          git diff --name-only "$original" "$p7" | sort > /tmp/pr7-changes.txt
          comm -12 /tmp/pr6-changes.txt /tmp/pr7-changes.txt > /tmp/overlap.txt
          count6=$(wc -l </tmp/pr6-changes.txt)
          count7=$(wc -l </tmp/pr7-changes.txt)
          count_overlap=$(wc -l </tmp/overlap.txt)
          tree6=$(git ls-tree -r --name-only "$p6" | wc -l)
          tree7=$(git ls-tree -r --name-only "$p7" | wc -l)

          {
            echo '## PR #6 / #7 virtual merge diagnostic'
            echo
            echo 'Diagnostic only. No repository refs, assets, or production deployments are changed.'
            echo
            echo "| Input | Full SHA |"
            echo "| --- | --- |"
            echo "| Main after CI PR #12 | \`$base\` |"
            echo "| Published PR #6 | \`$p6\` |"
            echo "| Published PR #7 | \`$p7\` |"
            echo "| Original PR common base | \`$original\` |"
            echo
            echo "- PR #6 changed paths (complete Git tree diff): **$count6**"
            echo "- PR #7 changed paths (complete Git tree diff): **$count7**"
            echo "- Overlapping changed paths: **$count_overlap**"
            echo "- PR #6 complete tree files: **$tree6**"
            echo "- PR #7 complete tree files: **$tree7**"
            echo
            echo '### Overlapping paths'
            echo '~~~'
            cat /tmp/overlap.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "Local diagnostic only"
          git config user.email "local-probe@example.invalid"

          set +e
          first_output=$(git merge-tree --write-tree --messages "$base" "$p6" 2>&1)
          first_status=$?
          set -e
          {
            echo
            echo "### Virtual merge: published PR #6 onto main"
            echo "- Git merge-tree exit code: **$first_status**"
            echo '~~~'
            printf '%s\n' "$first_output" | head -100
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$first_status" -ne 0 ]; then
            echo 'PR #6 could not be virtually merged onto the pinned main commit.'
            exit 0
          fi

          first_tree=$(printf '%s\n' "$first_output" | head -1)
          virtual_commit=$(printf 'Local-only virtual PR6 integration (not published)\n' |
            git commit-tree "$first_tree" -p "$base" -p "$p6")

          set +e
          second_output=$(git merge-tree --write-tree --messages "$virtual_commit" "$p7" 2>&1)
          second_status=$?
          set -e

          {
            echo
            echo '### Virtual merge: PR #7 after PR #6'
            echo "- Git merge-tree exit code: **$second_status**"
            if [ "$second_status" -eq 0 ]; then
              echo '- **Clean virtual merge**. This does not validate semantic correctness, artwork, tests, audits, or gameplay.'
            else
              echo '- **Conflicts detected**. Manual semantic reconciliation and tests are still required.'
            fi
            echo
            echo '~~~'
            printf '%s\n' "$second_output" | head -180
            echo '~~~'
            echo
            echo '**No remote branch, PR, main, deployment, or Myth workspace was modified.**'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Virtual merge results: PR6=$first_status PR7-after-PR6=$second_status"
          echo '=== BEGIN FULL DIAGNOSTIC SUMMARY ==='
          cat "$GITHUB_STEP_SUMMARY"
          echo '=== END FULL DIAGNOSTIC SUMMARY ==='
          # Exit zero: execution of this diagnostic is not an assertion of merge readiness.

  combined-checkout-validation:
    name: Validate combined checkout, tests and audit (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out pinned main (sparse, blobless)
        uses: actions/checkout@v4
        with:
          ref: 7e700c0eb392800794167007e076c51ac8357a77
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /.github/
            /index.html
            /package.json
            /package-lock.json
            /src/
            /public/
            /tests/
            /tools/*.mjs
            /tools/*.js
            /docs/animation-production/ASSET_AUDIT_LATEST.json
            /docs/animation-production/ASSET_AUDIT_LATEST.md
            /docs/animation-production/ASSET_STATUS.md
          sparse-checkout-cone-mode: false

      - name: Construct isolated combined checkout with only two known audit-file conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=7e700c0eb392800794167007e076c51ac8357a77
          p6=55a2ab104d6b108cc08132fddc01b32afb958e75
          p7=97119d54fd24c442c15192a798cae1e8a279eb1d
          git config user.name "GitHub CI diagnostic"
          git config user.email "ci-local@example.invalid"
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/codex/captain-animation-completion:refs/remotes/origin/codex/captain-animation-completion' \
            '+refs/heads/codex/issue-7-seven-donor-supporting-reuse:refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse'
          test "$(git rev-parse HEAD)" = "$base"
          test "$(git rev-parse refs/remotes/origin/codex/captain-animation-completion)" = "$p6"
          test "$(git rev-parse refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse)" = "$p7"
          # GitHub's blobless promisor fetch rejected an individually reachable PR7
          # blob in the first attempt. Pre-hydrate only changed source/audit blobs
          # via the authenticated REST blobs API; never fetch gigabytes of raw previews.
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const root='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const filesResponse=await fetch(root+'/pulls/7/files?per_page=100',{headers});
          if(!filesResponse.ok)throw new Error('PR file enumeration failed: '+filesResponse.status);
          const files=await filesResponse.json();
          const selected=files.filter(f=>f.status!=='removed'&&/^(src\/|tools\/|tests\/|docs\/animation-production\/ASSET_)/.test(f.filename));
          if(selected.length!==14)throw new Error('Unexpected changed-source file count '+selected.length);
          for(const file of selected) {
            const response=await fetch(root+'/git/blobs/'+file.sha,{headers});
            if(!response.ok)throw new Error('REST blob unavailable: '+file.filename+' '+response.status);
            const blob=await response.json();
            const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
            const result=spawnSync('git',['hash-object','-w','--stdin'],{input:bytes,encoding:'utf8'});
            if(result.status!==0||result.stdout.trim()!==file.sha)
              throw new Error('Unexpected blob hash for '+file.filename);
          }
          console.log('Verified and locally hydrated '+selected.length+' published PR7 source/audit blobs');
          NODE
          git merge --quiet --no-edit --no-ff "$p6"
          set +e
          git merge --no-commit --no-ff "$p7"
          merge_rc=$?
          set -e
          echo "PR7 merge exit status: $merge_rc"
          git diff --name-only --diff-filter=U | sort > /tmp/unmerged-paths.txt
          cat /tmp/unmerged-paths.txt
          expected=$(printf 'docs/animation-production/ASSET_AUDIT_LATEST.json\ndocs/animation-production/ASSET_AUDIT_LATEST.md\n')
          actual=$(cat /tmp/unmerged-paths.txt)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected conflict paths; stop instead of applying broad fallback"
            exit 1
          fi
          git checkout --ours -- \
            docs/animation-production/ASSET_AUDIT_LATEST.json \
            docs/animation-production/ASSET_AUDIT_LATEST.md
          git add \
            docs/animation-production/ASSET_AUDIT_LATEST.json \
            docs/animation-production/ASSET_AUDIT_LATEST.md
          git diff --name-only --diff-filter=U | tee /tmp/remaining-conflicts.txt
          test ! -s /tmp/remaining-conflicts.txt
          git commit -m "Local-only combined PR6 PR7 rehearsal; audit regeneration pending"
          test -f tools/audit-animation-assets.mjs
          test -f public/assets/animation/manifest.json
          git show HEAD:src/render/animation-sprites.js > /tmp/merged-renderer.js
          grep -q 'library.maskProfile,key' /tmp/merged-renderer.js
          grep -q 'productionSpriteBaselineOffsetY' /tmp/merged-renderer.js
          grep -q 'target.y-target.z' /tmp/merged-renderer.js
          {
            echo '## Ephemeral combined checkout (unpublished)'
            echo
            echo "- Exact inputs: main \`$base\`; PR6 \`$p6\`; PR7 \`$p7\`"
            echo '- Both Git merges completed locally; only two expected audit-file conflicts were resolved provisionally.'
            echo '- Combined renderer retains both the support palette-profile call and captain baseline/ball-depth functions.'
            echo '- The two audit files must be regenerated from the combined manifest before their contents are accepted.'
            echo '- This job never pushes, merges remote PRs, deploys, or changes the Myth workspace.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies and ImageMagick
        shell: bash
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          python -m pip install --quiet playwright
          command -v google-chrome || command -v chromium

      - name: Regenerate combined animation audit from real atlas pixels
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-animation-assets.mjs \
            --report-only \
            --json docs/animation-production/ASSET_AUDIT_LATEST.json \
            --markdown docs/animation-production/ASSET_AUDIT_LATEST.md |
            tee /tmp/reconciled-audit-summary.json
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const newAudit = JSON.parse(readFileSync('docs/animation-production/ASSET_AUDIT_LATEST.json','utf8'));
          const previous = JSON.parse(readFileSync('/tmp/reconciled-audit-summary.json','utf8'));
          console.log('Combined audit summary:', JSON.stringify(previous,null,2));
          if(newAudit.athletes !== 105 || newAudit.clipDefinitions !== 29) {
            throw new Error('Unexpected league roster or clip count');
          }
          if(newAudit.targetShortfalls.length !== 0) throw new Error('New target frame shortfalls');
          const {missingClipCount,inspectedClips,errors}=newAudit;
          const findings=Object.groupBy(errors,x=>x.code);
          const brief = Object.fromEntries(Object.entries(findings).map(([k,v])=>[k,v.length]));
          const summary=[
            '### Combined pixel audit (report-only)',
            '',
            '- Athletes: **'+newAudit.athletes+'**',
            '- Inspected clips: **'+inspectedClips+'**',
            '- Missing directional clips: **'+missingClipCount+'**',
            '- Frame-target shortfalls: **'+newAudit.targetShortfalls.length+'**',
            '- Other audit findings: '+JSON.stringify(brief),
            '',
            'The strict league audit is expected to remain incomplete while other captains have missing clips.'
          ];
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n')+'\n');
          NODE

      - name: Run focused gameplay integration regression tests
        run: node --test --test-name-pattern='reviewed supporting athletes keep the separate game ball at their lead hand|Marin.s pass meets Kraken' tests/animation.test.js tests/kraken-receive.integration.test.js

      - name: Scratch per-clip Marin track compatibility (preserve original individual tracks)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp src/core/animation.js /tmp/animation.js.pr6-7-original
          cp tests/animation.test.js /tmp/animation.test.pr6-7-original
          trap 'cp /tmp/animation.js.pr6-7-original src/core/animation.js; cp /tmp/animation.test.pr6-7-original tests/animation.test.js' EXIT
          python - <<'PY'
          from pathlib import Path
          p=Path('src/core/animation.js')
          s=p.read_text()
          old="athleteBallTracks['marin-dusk']={'receive':{height:[1.3,1.35,1.7,1.75],forward:[4,4,2,1]},'idle-ball':{height:[1.45,1.45,1.45,1.45],forward:[1,1,1,1]}};"
          new="""// Scratch candidate only. Keep individual Marin dribble and ball-ready track ownership.
          // Calibrate receive and idle-ball to the actual PR7 Juniper donor pose geometry.
          // Preserve the PR6 Echo-source pass profile at the historical tall/compact scale (1/.88).
          Object.assign(athleteBallTracks['marin-dusk'],{
            receive:{height:[1.0,2.0,1.7,1.75],forward:[9,10,2,1]},
            'idle-ball':{height:[1.05,.75,.65,.9],forward:[6,7,7,6]},
            pass:{height:[1,1.05,1.2,1.6,1.3,1].map(v=>v/.88),forward:[5,4,13,19,16,8].map(v=>v/.88)}
          });"""
          assert s.count(old)==1, 'Unexpected original Marin track assignment'
          p.write_text(s.replace(old,new))
          PY

          node --input-type=module <<'NODE'
          import {sampleBallForward,sampleBallHeight,athleteBallTrackSource} from './src/core/animation.js';
          import {supportingAnimationLibraries} from './src/content/supporting-animation-libraries.js';
          if(supportingAnimationLibraries['marin-dusk'].donorId!=='juniper-vale')throw new Error('Marin visual donor altered');
          for(const [clip,expected] of [['idle-ball','marin-dusk'],['dribble','marin-dusk'],['dribble-run','marin-dusk'],['receive','marin-dusk'],['pass','marin-dusk']]){
            const src=athleteBallTrackSource('marin-dusk',clip,'forward');
            console.log('Marin',clip,'forward source',src,'sample',sampleBallForward(clip,0,'marin-dusk'),'height',sampleBallHeight(clip,0,'marin-dusk'));
            if(src!==expected)throw new Error('unexpected Marin track source '+clip+': '+src+' expected '+expected);
          }
          NODE

          # Strict proposed test-migration in scratch only: visual identity has changed.
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/animation.test.js')
          s=p.read_text()
          old1="assert.equal(sampleBallForward('idle-ball',p.animation.tick,id),1,'Marin’s reviewed receive/idle-ball track holds the ball close to her torso');"
          new1="assert.equal(sampleBallForward('idle-ball',p.animation.tick,id),6,'Marin’s Juniper visual lead-hand track reaches the outstretched hand');"
          old2="assert.equal(sampleBallHeight('idle-ball',p.animation.tick,id),1.45,'Marin’s separate ball remains chest high');"
          new2="assert.equal(sampleBallHeight('idle-ball',p.animation.tick,id),1.05,'Marin’s separate ball follows the new lead-hand pose');"
          assert s.count(old1)==1 and s.count(old2)==1
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          set +e
          node --test --test-name-pattern='reviewed supporting athletes keep the separate game ball at their lead hand|Marin.s pass meets Kraken' tests/animation.test.js tests/kraken-receive.integration.test.js
          test_rc=$?
          set -e
          echo "Scratch per-clip track two focused tests exit code: $test_rc"

          # Build the unmodified PR6 review harness locally, then freeze background
          # animation and explicitly await donor images before each screenshot.
          git show 55a2ab104d6b108cc08132fddc01b32afb958e75:tools/capture-marin-ball-track-review.py |
            sed "s@executable_path='/usr/bin/chromium'@executable_path='/usr/bin/google-chrome'@" > tools/capture-marin-ball-track-review-ci.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/capture-marin-ball-track-review-ci.py')
          s=p.read_text()
          old="                page.on('pageerror', lambda exc: REPORT['errors'].append(str(exc)))"
          assert s.count(old)==1
          s=s.replace(old,old+"\n                page.add_init_script('window.requestAnimationFrame=()=>0')")
          old2="                        page.wait_for_timeout(100)"
          assert s.count(old2)==1
          s=s.replace(old2,"                        page.evaluate('window.jamverse.tick(0,[])')\n                        page.wait_for_timeout(50)")
          ready="                page.wait_for_function(\"() => ['./public/assets/animation/juniper-vale-receive-right.webp','./public/assets/animation/juniper-vale-idle-ball-right.webp'].every(src => {const im=window.__productionSpriteImagesForReview?.get(src);return Boolean(im?.complete && im.naturalWidth)})\", timeout=120000, polling=100)"
          lines=s.splitlines()
          revised=[]
          inserted=0
          for line in lines:
              if line.strip()=="for clip, ticks in FRAME_TICKS.items():":
                  revised.append(ready)
                  inserted+=1
              revised.append(line)
          assert inserted==1
          p.write_text('\n'.join(revised)+'\n')
          PY
          # The existing PR6 proof-harness writes to temporary runner storage.
          # Mark its saved files as an unaccepted scratch candidate, not accepted review.
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/capture-marin-ball-track-review-ci.py')
          s=p.read_text()
          s=s.replace("'registered-normal-loader'", "'scratch-unpublished-normal-loader'")
          # Ensure the first pose also has the actual registered donor atlas ready.
          lines=s.splitlines()
          lines=["    REPORT['tracks']={'status':'scratch-only-unaccepted','note':'Actual sampled values are in captures; not legacy PR6 constants'}" if line.startswith("    REPORT['tracks']=") else line for line in lines]
          s='\n'.join(lines)+'\n'
          p.write_text(s)
          PY
          python tools/capture-marin-ball-track-review-ci.py

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/generate-art/previews/marin-dusk-ball-track-review-05/report.json')
          obj=json.loads(p.read_text())
          assert obj['captureCount']==40
          assert not obj['errors']
          assert obj['assetMode']=='scratch-unpublished-normal-loader'
          for cap in obj['captures']:
              if cap.get('clip') in ('receive','idle-ball'):
                  assert cap.get('selection') is not None, ('missing selected production sprite',cap['facing'],cap['zoom'],cap['clip'],cap['tick'])
                  expected=f"./public/assets/animation/juniper-vale-{cap['clip']}-right.webp"
                  assert cap['selection']['src']==expected,(cap['clip'],cap['selection']['src'],expected)
          print('All reviewed saved poses selected real registered Juniper atlas for both facings and both zooms')
          PY
          # Fetch the pinned diagnostic helper from this maintenance branch via
          # GitHub's authenticated blobs API. Checkout itself remains exact main+PR6+PR7.
          mkdir -p tools/diagnostics
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const sha='7e59670f3b7e089da3ec241c161068403e05521f';
          const response=await fetch('https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha,{
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}
          });
          if(!response.ok)throw new Error('Cannot read pinned review harness: '+response.status);
          const blob=await response.json();
          const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
          const verify=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(verify.status!==0||verify.stdout.trim()!==sha)throw new Error('Diagnostic harness blob SHA mismatch');
          writeFileSync('tools/diagnostics/marin-live-validation.py',bytes);
          NODE
          python -m py_compile tools/diagnostics/marin-live-validation.py
          python tools/diagnostics/marin-live-validation.py
          echo 'Native game-driven Marin ball/contact evidence captured; independent visual review pending.'
          {
            echo '### Scratch Marin per-action compatibility (not published)'
            echo
            echo '- Visual donor: Juniper Vale (unchanged).'
            echo '- Restores individual Marin idle-ball/dribble/dribble-run tracks rather than replacing the whole athlete track registry.'
            echo '- Proposes pose-specific Marin/Juniper receiving and idle tracks plus historical pass handoff with tall/compact scaling.'
            echo "- Two focused gameplay test exit code: **$test_rc**"
            echo '- Captures use normal loader source and renderer but a **scratch-only local track candidate**; not independent acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$test_rc" -ne 0 ]; then
            echo 'Scratch track proposal fails existing mechanical acceptance. Kept as rejected-only experiment.'
          fi

      - name: Publish scratch Marin per-action visual captures (not accepted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marin-per-action-scratch-review
          path: tools/generate-art/previews/marin-dusk-ball-track-review-05/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish native action-driven gameplay captures (not accepted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marin-action-driven-normal-loader
          path: tools/generate-art/previews/marin-live-pr6-pr7-scratch/
          if-no-files-found: warn
          retention-days: 7

      - name: Run lint and content validation
        if: success() || failure()
        run: |
          npm run lint
          npm run validate:content
          npm run simulate:league

      - name: Produce non-deployed standalone build
        if: success() || failure()
        run: npm run build

      - name: Check worktree hygiene and final generated file differences
        if: always()
        shell: bash
        run: |
          git status --short | head -100
          git diff --check
          echo '### Test job outcome' >> "$GITHUB_STEP_SUMMARY"
          echo 'See individual job steps above. No checkout contents were pushed or deployed.' >> "$GITHUB_STEP_SUMMARY"

  pr6-baseline-gameplay:
    name: Compare accepted PR6 gameplay assertions before donor reassignments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact accepted PR6 with lightweight sources
        uses: actions/checkout@v4
        with:
          ref: 55a2ab104d6b108cc08132fddc01b32afb958e75
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /package.json
            /package-lock.json
            /src/
            /public/assets/animation/
            /tests/animation.test.js
            /tests/kraken-receive.integration.test.js
          sparse-checkout-cone-mode: false
      - name: Install dependencies
        run: npm ci
      - name: Run the two PR6 acceptance assertions unchanged
        run: node --test --test-name-pattern='reviewed supporting athletes keep the separate game ball at their lead hand|Marin.s pass meets Kraken' tests/animation.test.js tests/kraken-receive.integration.test.js
