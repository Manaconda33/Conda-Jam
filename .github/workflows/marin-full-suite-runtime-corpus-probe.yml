name: Marin complete suite fourth pinned fixture recovery (diagnostic only)

on:
  push:
    branches:
      - maintenance/pr6-pr7-reconciliation-probe
    paths:
      - '.github/workflows/marin-full-suite-runtime-corpus-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro-calibration:
    name: All npm tests and source-pixel audit on scoped checkout
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out complete runtime asset and test paths from pinned main
        uses: actions/checkout@v4
        with:
          ref: 7e700c0eb392800794167007e076c51ac8357a77
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /.github/
            /index.html
            /package.json
            /package-lock.json
            /src/
            /public/
            /tests/
            /tools/*.mjs
            /tools/*.js
            /docs/animation-production/ASSET_AUDIT_LATEST.json
            /docs/animation-production/ASSET_AUDIT_LATEST.md
          sparse-checkout-cone-mode: false

      - name: Assemble original pinned PR6/PR7 checkout in runner only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          p6=55a2ab104d6b108cc08132fddc01b32afb958e75
          p7=97119d54fd24c442c15192a798cae1e8a279eb1d
          git config user.name 'GitHub CI diagnostic'
          git config user.email 'ci-local@example.invalid'
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/codex/captain-animation-completion:refs/remotes/origin/codex/captain-animation-completion' \
            '+refs/heads/codex/issue-7-seven-donor-supporting-reuse:refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse'
          test "$(git rev-parse HEAD)" = 7e700c0eb392800794167007e076c51ac8357a77
          test "$(git rev-parse refs/remotes/origin/codex/captain-animation-completion)" = "$p6"
          test "$(git rev-parse refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse)" = "$p7"
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const base='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const response=await fetch(base+'/pulls/7/files?per_page=100',{headers});
          if(!response.ok) throw Error('PR7 files unavailable: '+response.status);
          const files=await response.json();
          const selected=files.filter(f=>f.status!=='removed'&&/^(src\/|tools\/|tests\/|docs\/animation-production\/ASSET_)/.test(f.filename));
          if(selected.length!==14) throw Error('Unexpected PR7 changed source count '+selected.length);
          for(const file of selected) {
            const response=await fetch(base+'/git/blobs/'+file.sha,{headers});
            if(!response.ok)throw Error('Missing PR7 blob '+file.filename);
            const blob=await response.json();
            const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
            const got=spawnSync('git',['hash-object','-w','--stdin'],{input:bytes,encoding:'utf8'});
            if(got.status!==0||got.stdout.trim()!==file.sha)throw Error('PR7 blob hash mismatch '+file.filename);
          }
          console.log('Hydrated all 14 pinned PR7 source/audit blobs');
          NODE
          git merge --quiet --no-edit --no-ff "$p6"
          set +e
          git merge --no-commit --no-ff "$p7"
          rc=$?
          set -e
          test "$rc" -eq 1
          git diff --name-only --diff-filter=U | sort > /tmp/marin-unmerged.txt
          expected=$(printf 'docs/animation-production/ASSET_AUDIT_LATEST.json\ndocs/animation-production/ASSET_AUDIT_LATEST.md\n')
          test "$(cat /tmp/marin-unmerged.txt)" = "$expected"
          git checkout --ours -- docs/animation-production/ASSET_AUDIT_LATEST.json docs/animation-production/ASSET_AUDIT_LATEST.md
          git add docs/animation-production/ASSET_AUDIT_LATEST.json docs/animation-production/ASSET_AUDIT_LATEST.md
          git commit -qm 'Ephemeral pinned integration only; generated audit excluded from acceptance'
          grep -q 'library.maskProfile,key' src/render/animation-sprites.js
          grep -q 'productionSpriteBaselineOffsetY' src/render/animation-sprites.js
          echo 'Only two known generated-audit conflicts; no remote code was altered.'

      - name: Install EXACT committed Marin candidate source in ephemeral combined checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # PR #7 does not modify animation.js. Abort rather than clobber a new integration change.
          test "$(git hash-object src/core/animation.js)" = d2540e37cc8cb635e3263a54f5794052fd8d6847
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync,readFileSync} from 'node:fs';
          // This is the exact source blob committed to the separate review-only branch.
          const sha='2b1413fce2582fd588f7df111bfb719e8605f046';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Versioned candidate blob unavailable: '+r.status);
          const blob=await r.json();
          const bytes=Buffer.from(blob.content.replace(/\\s/g,''),'base64');
          const verify=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(verify.status!==0||verify.stdout.trim()!==sha)throw Error('Committed candidate blob hash mismatch');
          const source=bytes.toString('utf8');
          if(!source.includes("donorId === 'juniper-vale'"))throw Error('Juniper-only guard missing');
          if(!source.includes("'dribble-run':{forward:[8,9,10,9,8,9,11,10,9,8,8]}"))throw Error('Frame 3/4/5 calibration missing');
          writeFileSync('src/core/animation.js',bytes);
          console.log('Ephemeral integration now uses exact committed review-branch candidate source '+sha);
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          node --input-type=module <<'NODE'
          import {sampleBallForward,sampleBallHeight,athleteBallTrackSource} from './src/core/animation.js';
          import {supportingAnimationLibraries} from './src/content/supporting-animation-libraries.js';
          if(supportingAnimationLibraries['marin-dusk'].donorId!=='juniper-vale')throw Error('Visual donor changed');
          const actual=sampleBallForward('dribble-run',8,'marin-dusk');
          const height=sampleBallHeight('dribble-run',8,'marin-dusk');
          if(actual!==8)throw Error('Frame4 horizontal candidate not active: '+actual);
          const ticks=[4,5,6,7,8,9,10,11,12];
          const observed=ticks.map(t=>sampleBallForward('dribble-run',t,'marin-dusk'));
          const expected=[10,9.5,9,8.5,8,8.5,9,10,11];
          if(observed.some((v,i)=>Math.abs(v-expected[i])>1e-8))throw Error('Full bounce forward samples mismatch: '+observed);
          if(Math.abs(height-.25)>1e-9)throw Error('Bounce height unexpectedly changed: '+height);
          if(athleteBallTrackSource('marin-dusk','dribble-run','forward')!=='marin-dusk')throw Error('Own dribble track not retained');
          for(const clip of ['idle-ball','dribble','dribble-run','receive','pass']){
            if(athleteBallTrackSource('marin-dusk',clip,'forward')!=='marin-dusk')throw Error('Marin action not owned by Marin: '+clip);
          }
          console.log(JSON.stringify({visualDonor:'juniper-vale',clip:'dribble-run',tick:8,frame:4,originalControls:[11,12,12],previousScratchControls:[11,8,12],candidateControls:[9,8,9],bounceSamples:observed,bounceHeight:height}));
          NODE

      - name: Install production test and image decoding requirements
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v identify

      - name: Verify source-matched regression migration (runner local, no source changes)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The PR6-original test is retained on its protected branch. For this
          # combined local checkout, use exact source-versioned test corrections.
          test "$(git hash-object tests/animation.test.js)" = e09490c73e6f0facdb8f65253469c9f22de5f27b
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const sha='9456ffdcdf73f397c15a520b48f75a6cc91ca569';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Saved regression test unavailable: '+r.status);
          const blob=await r.json(),bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
          const verify=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(verify.status!==0||verify.stdout.trim()!==sha)throw Error('Versioned regression test hash mismatch');
          const source=bytes.toString('utf8');
          if(!source.includes("const expectedForward=usesJuniper?6:1"))throw Error('Legacy donor expectation not retained');
          if(!source.includes("const expectedHeight=usesJuniper?1.05:1.45"))throw Error('Legacy ball height expectation not retained');
          if(!source.includes("Marin ball-track migration preserves the old donor"))throw Error('Calibration test missing');
          if(!source.includes("const expectedEchoHeight=[.85,.70,.55,.40,.25,.125,0,.125,.25]"))throw Error("Echo scaled-height assertion missing");
          writeFileSync('tests/animation.test.js',bytes);
          console.log('Pinned migration test source installed in ephemeral checkout');
          NODE
          test "$(git hash-object tests/animation.test.js)" = 9456ffdcdf73f397c15a520b48f75a6cc91ca569
          node --test --test-name-pattern="Marin ball-track migration|reviewed supporting athletes keep the separate game ball at their lead hand|Marin.s pass meets Kraken" \
            tests/animation.test.js tests/kraken-receive.integration.test.js
          echo '### Committed Marin regression migration (review-only)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Two historical donor-specific idle-ball assertions remain strict, with conditionally correct baselines.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Marin authored 9/8/9 bounce and Kraken real pass/catch tests executed against combined saved source.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Original PR6 test files, PR7, main, and production artifacts remain untouched.' >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm full tracked runtime corpus and pinned integration source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          test "$(git hash-object tests/animation.test.js)" = 9456ffdcdf73f397c15a520b48f75a6cc91ca569
          test -f public/assets/animation/manifest.json
          test -f public/assets/animation/juniper-vale-dribble-run-right.webp
          test -f public/assets/animation/kraken-receive-right.webp
          mkdir -p ci-diagnostic
          echo "scope=sparse-source-tests-entire-public-runtime-not-full-historical-repo" > ci-diagnostic/provenance.txt
          echo "main=7e700c0eb392800794167007e076c51ac8357a77" >> ci-diagnostic/provenance.txt
          echo "pr6=55a2ab104d6b108cc08132fddc01b32afb958e75" >> ci-diagnostic/provenance.txt
          echo "pr7=97119d54fd24c442c15192a798cae1e8a279eb1d" >> ci-diagnostic/provenance.txt
          echo "source_blob=2b1413fce2582fd588f7df111bfb719e8605f046" >> ci-diagnostic/provenance.txt
          echo "tests_blob=9456ffdcdf73f397c15a520b48f75a6cc91ca569" >> ci-diagnostic/provenance.txt
          printf "asset_files=" >> ci-diagnostic/provenance.txt
          find public/assets/animation -type f | wc -l >> ci-diagnostic/provenance.txt
          printf "asset_bytes=" >> ci-diagnostic/provenance.txt
          du -sb public/assets/animation | cut -f1 >> ci-diagnostic/provenance.txt
          cat ci-diagnostic/provenance.txt

      - name: Execute all npm test, lint, content, league and isolated build checks
        shell: bash
        run: |
          for script in test lint validate:content simulate:league build; do
            name="$(echo "$script" | tr : -)"
            set +e
            if [ "$script" = test ]; then
              timeout 480s npm test >"ci-diagnostic/$name.log" 2>&1
            else
              timeout 240s npm run "$script" >"ci-diagnostic/$name.log" 2>&1
            fi
            status=$?
            set -e
            echo "$status" >"ci-diagnostic/$name.exit"
            echo "$script exit $status"
            tail -n 32 "ci-diagnostic/$name.log"
          done

      - name: Recover only hash-verified missing historical test fixtures from pinned PR6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const log=fs.readFileSync('ci-diagnostic/test.log','utf8');
          const absolutes=[...log.matchAll(/Error: ENOENT: no such file or directory, open '([^']+)'/g)].map(m=>m[1]);
          const names=[...new Set(absolutes.map(f=>path.relative(process.cwd(),f)))].sort();
          const root='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const pin='55a2ab104d6b108cc08132fddc01b32afb958e75';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const results=[];
          let index=0;
          async function downloadOne(rel){
            if(rel.startsWith('..')||path.isAbsolute(rel)||
              !(rel.startsWith('tools/generate-art/')||rel==='docs/LOSSLESS_ATLAS_PROVENANCE.json'))
              return {path:rel,ok:false,why:'File path not in strict allowlist'};
            const encoded=rel.split('/').map(encodeURIComponent).join('/');
            const url=root+'/contents/'+encoded+'?ref='+pin;
            try{
              const response=await fetch(url,{headers});
              if(!response.ok)return {path:rel,ok:false,why:'Pinned PR6 path metadata HTTP '+response.status};
              const meta=await response.json();
              if(meta.type!=='file'||!meta.sha||meta.size>65_000_000)return {path:rel,ok:false,why:'Invalid or oversized pinned file'};
              const blobResponse=await fetch(root+'/git/blobs/'+meta.sha,{headers});
              if(!blobResponse.ok)return {path:rel,ok:false,why:'Pinned blob unavailable HTTP '+blobResponse.status,sha:meta.sha};
              const blob=await blobResponse.json();
              const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
              if(bytes.length!==meta.size)return {path:rel,ok:false,why:'Fixture size mismatch',sha:meta.sha};
              const verified=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
              if(verified.status!==0||verified.stdout.trim()!==meta.sha)
                return {path:rel,ok:false,why:'Fixture Git hash mismatch',sha:meta.sha};
              fs.mkdirSync(path.dirname(rel),{recursive:true});
              fs.writeFileSync(rel,bytes);
              return {path:rel,ok:true,bytes:bytes.length,sha:meta.sha};
            }catch(e){return {path:rel,ok:false,why:String(e)}}
          }
          await Promise.all(Array.from({length:4},async()=>{
            while(index<names.length)results.push(await downloadOne(names[index++]));
          }));
          results.sort((a,b)=>a.path.localeCompare(b.path));
          const summary={source:'exact pinned PR6 GitHub REST metadata + verified Git blobs',
            initialMissingFixturePaths:names.length,hydrated:results.filter(r=>r.ok).length,
            unavailable:results.filter(r=>!r.ok),files:results};
          fs.writeFileSync('ci-diagnostic/fixture-hydration.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({initialMissingFixturePaths:names.length,hydrated:summary.hydrated,unavailable:summary.unavailable},null,2));
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          test "$(git hash-object tests/animation.test.js)" = 9456ffdcdf73f397c15a520b48f75a6cc91ca569

      - name: Re-run complete npm test against exact pinned recovered fixtures
        shell: bash
        run: |
          set +e
          timeout 540s npm test >ci-diagnostic/test-hydrated.log 2>&1
          code=$?
          set -e
          echo "$code" > ci-diagnostic/test-hydrated.exit
          echo "Hydrated fixture npm test exit $code"
          tail -n 60 ci-diagnostic/test-hydrated.log

      - name: Recover second wave of test fixture dependencies from pinned PR6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const log=fs.readFileSync('ci-diagnostic/test-hydrated.log','utf8');
          const absolutes=[...log.matchAll(/Error: ENOENT: no such file or directory, open '([^']+)'/g)].map(m=>m[1]);
          const names=[...new Set(absolutes.map(f=>path.relative(process.cwd(),f)))].sort();
          const root='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const pin='55a2ab104d6b108cc08132fddc01b32afb958e75';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const results=[];
          let index=0;
          async function downloadOne(rel){
            if(rel.startsWith('..')||path.isAbsolute(rel)||
              !(rel.startsWith('tools/generate-art/')||rel==='docs/LOSSLESS_ATLAS_PROVENANCE.json'))
              return {path:rel,ok:false,why:'File path not in strict allowlist'};
            const encoded=rel.split('/').map(encodeURIComponent).join('/');
            const url=root+'/contents/'+encoded+'?ref='+pin;
            try{
              const response=await fetch(url,{headers});
              if(!response.ok)return {path:rel,ok:false,why:'Pinned PR6 path metadata HTTP '+response.status};
              const meta=await response.json();
              if(meta.type!=='file'||!meta.sha||meta.size>65_000_000)return {path:rel,ok:false,why:'Invalid or oversized pinned file'};
              const blobResponse=await fetch(root+'/git/blobs/'+meta.sha,{headers});
              if(!blobResponse.ok)return {path:rel,ok:false,why:'Pinned blob unavailable HTTP '+blobResponse.status,sha:meta.sha};
              const blob=await blobResponse.json();
              const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
              if(bytes.length!==meta.size)return {path:rel,ok:false,why:'Fixture size mismatch',sha:meta.sha};
              const verified=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
              if(verified.status!==0||verified.stdout.trim()!==meta.sha)
                return {path:rel,ok:false,why:'Fixture Git hash mismatch',sha:meta.sha};
              fs.mkdirSync(path.dirname(rel),{recursive:true});
              fs.writeFileSync(rel,bytes);
              return {path:rel,ok:true,bytes:bytes.length,sha:meta.sha};
            }catch(e){return {path:rel,ok:false,why:String(e)}}
          }
          await Promise.all(Array.from({length:4},async()=>{
            while(index<names.length)results.push(await downloadOne(names[index++]));
          }));
          results.sort((a,b)=>a.path.localeCompare(b.path));
          const summary={source:'exact pinned PR6 GitHub REST metadata + verified Git blobs',
            initialMissingFixturePaths:names.length,hydrated:results.filter(r=>r.ok).length,
            unavailable:results.filter(r=>!r.ok),files:results};
          fs.writeFileSync('ci-diagnostic/fixture-hydration2.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({initialMissingFixturePaths:names.length,hydrated:summary.hydrated,unavailable:summary.unavailable},null,2));
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          test "$(git hash-object tests/animation.test.js)" = 9456ffdcdf73f397c15a520b48f75a6cc91ca569

      - name: Re-run full npm tests after second pinned dependency recovery
        shell: bash
        run: |
          set +e
          timeout 540s npm test >ci-diagnostic/test-hydrated2.log 2>&1
          code=$?
          set -e
          echo "$code" > ci-diagnostic/test-hydrated2.exit
          echo "Hydrated fixture npm test exit $code"
          tail -n 60 ci-diagnostic/test-hydrated2.log

      - name: Recover third wave of still-missing PR6 test fixtures, by exact hash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const log=fs.readFileSync('ci-diagnostic/test-hydrated2.log','utf8');
          const absolutes=[...log.matchAll(/Error: ENOENT: no such file or directory, open '([^']+)'/g)].map(m=>m[1]);
          const names=[...new Set(absolutes.map(f=>path.relative(process.cwd(),f)))].sort();
          const root='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const pin='55a2ab104d6b108cc08132fddc01b32afb958e75';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const results=[];
          let index=0;
          async function downloadOne(rel){
            if(rel.startsWith('..')||path.isAbsolute(rel)||
              !(rel.startsWith('tools/generate-art/')||rel==='docs/LOSSLESS_ATLAS_PROVENANCE.json'))
              return {path:rel,ok:false,why:'File path not in strict allowlist'};
            const encoded=rel.split('/').map(encodeURIComponent).join('/');
            const url=root+'/contents/'+encoded+'?ref='+pin;
            try{
              const response=await fetch(url,{headers});
              if(!response.ok)return {path:rel,ok:false,why:'Pinned PR6 path metadata HTTP '+response.status};
              const meta=await response.json();
              if(meta.type!=='file'||!meta.sha||meta.size>65_000_000)return {path:rel,ok:false,why:'Invalid or oversized pinned file'};
              const blobResponse=await fetch(root+'/git/blobs/'+meta.sha,{headers});
              if(!blobResponse.ok)return {path:rel,ok:false,why:'Pinned blob unavailable HTTP '+blobResponse.status,sha:meta.sha};
              const blob=await blobResponse.json();
              const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
              if(bytes.length!==meta.size)return {path:rel,ok:false,why:'Fixture size mismatch',sha:meta.sha};
              const verified=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
              if(verified.status!==0||verified.stdout.trim()!==meta.sha)
                return {path:rel,ok:false,why:'Fixture Git hash mismatch',sha:meta.sha};
              fs.mkdirSync(path.dirname(rel),{recursive:true});
              fs.writeFileSync(rel,bytes);
              return {path:rel,ok:true,bytes:bytes.length,sha:meta.sha};
            }catch(e){return {path:rel,ok:false,why:String(e)}}
          }
          await Promise.all(Array.from({length:4},async()=>{
            while(index<names.length)results.push(await downloadOne(names[index++]));
          }));
          results.sort((a,b)=>a.path.localeCompare(b.path));
          const summary={source:'exact pinned PR6 GitHub REST metadata + verified Git blobs',
            initialMissingFixturePaths:names.length,hydrated:results.filter(r=>r.ok).length,
            unavailable:results.filter(r=>!r.ok),files:results};
          fs.writeFileSync('ci-diagnostic/fixture-hydration3.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({initialMissingFixturePaths:names.length,hydrated:summary.hydrated,unavailable:summary.unavailable},null,2));
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          test "$(git hash-object tests/animation.test.js)" = 9456ffdcdf73f397c15a520b48f75a6cc91ca569

      - name: Re-run complete npm tests after third bounded fixture recovery
        shell: bash
        run: |
          set +e
          timeout 540s npm test >ci-diagnostic/test-hydrated3.log 2>&1
          code=$?
          set -e
          echo "$code" > ci-diagnostic/test-hydrated3.exit
          echo "Hydrated fixture npm test exit $code"
          tail -n 60 ci-diagnostic/test-hydrated3.log

      - name: Recover fourth wave of eleven observed historical PR6 fixtures by hash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const log=fs.readFileSync('ci-diagnostic/test-hydrated3.log','utf8');
          const absolutes=[...log.matchAll(/Error: ENOENT: no such file or directory, open '([^']+)'/g)].map(m=>m[1]);
          const names=[...new Set(absolutes.map(f=>path.relative(process.cwd(),f)))].sort();
          const root='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const pin='55a2ab104d6b108cc08132fddc01b32afb958e75';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const results=[];
          let index=0;
          async function downloadOne(rel){
            if(rel.startsWith('..')||path.isAbsolute(rel)||
              !(rel.startsWith('tools/generate-art/')||rel==='docs/LOSSLESS_ATLAS_PROVENANCE.json'))
              return {path:rel,ok:false,why:'File path not in strict allowlist'};
            const encoded=rel.split('/').map(encodeURIComponent).join('/');
            const url=root+'/contents/'+encoded+'?ref='+pin;
            try{
              const response=await fetch(url,{headers});
              if(!response.ok)return {path:rel,ok:false,why:'Pinned PR6 path metadata HTTP '+response.status};
              const meta=await response.json();
              if(meta.type!=='file'||!meta.sha||meta.size>65_000_000)return {path:rel,ok:false,why:'Invalid or oversized pinned file'};
              const blobResponse=await fetch(root+'/git/blobs/'+meta.sha,{headers});
              if(!blobResponse.ok)return {path:rel,ok:false,why:'Pinned blob unavailable HTTP '+blobResponse.status,sha:meta.sha};
              const blob=await blobResponse.json();
              const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
              if(bytes.length!==meta.size)return {path:rel,ok:false,why:'Fixture size mismatch',sha:meta.sha};
              const verified=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
              if(verified.status!==0||verified.stdout.trim()!==meta.sha)
                return {path:rel,ok:false,why:'Fixture Git hash mismatch',sha:meta.sha};
              fs.mkdirSync(path.dirname(rel),{recursive:true});
              fs.writeFileSync(rel,bytes);
              return {path:rel,ok:true,bytes:bytes.length,sha:meta.sha};
            }catch(e){return {path:rel,ok:false,why:String(e)}}
          }
          await Promise.all(Array.from({length:4},async()=>{
            while(index<names.length)results.push(await downloadOne(names[index++]));
          }));
          results.sort((a,b)=>a.path.localeCompare(b.path));
          const summary={source:'exact pinned PR6 GitHub REST metadata + verified Git blobs',
            initialMissingFixturePaths:names.length,hydrated:results.filter(r=>r.ok).length,
            unavailable:results.filter(r=>!r.ok),files:results};
          fs.writeFileSync('ci-diagnostic/fixture-hydration4.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({initialMissingFixturePaths:names.length,hydrated:summary.hydrated,unavailable:summary.unavailable},null,2));
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          test "$(git hash-object tests/animation.test.js)" = 9456ffdcdf73f397c15a520b48f75a6cc91ca569

      - name: Re-run complete npm tests after fourth bounded fixture recovery
        shell: bash
        run: |
          set +e
          timeout 540s npm test >ci-diagnostic/test-hydrated4.log 2>&1
          code=$?
          set -e
          echo "$code" > ci-diagnostic/test-hydrated4.exit
          echo "Hydrated fixture npm test exit $code"
          tail -n 60 ci-diagnostic/test-hydrated4.log

      - name: Regenerate report-only asset source and provenance audit
        shell: bash
        run: |
          set +e
          timeout 480s node tools/audit-animation-assets.mjs --report-only --json ci-diagnostic/audit.json --markdown ci-diagnostic/audit.md >ci-diagnostic/audit.log 2>&1
          status=$?
          set -e
          echo "$status" >ci-diagnostic/audit.exit
          echo "audit exit $status"
          tail -n 65 ci-diagnostic/audit.log

      - name: Preserve each test result and classify audit honestly
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=n=>{try{return fs.readFileSync('ci-diagnostic/'+n,'utf8').trim()}catch{return null}};
          const keys=['test','test-hydrated','test-hydrated2','test-hydrated3','test-hydrated4','lint','validate-content','simulate-league','build','audit'];
          const exits=Object.fromEntries(keys.map(k=>[k,read(k+'.exit')]));
          const output={scope:'sparse-source-tests-complete-runtime-public-assets',exits,sourceBlob:'2b1413fce2582fd588f7df111bfb719e8605f046',testBlob:'9456ffdcdf73f397c15a520b48f75a6cc91ca569'};
          if(read('audit.json')){
            const a=JSON.parse(read('audit.json'));
            output.assetAudit={
              ok:a.ok,athletes:a.athletes,inspectedClips:a.inspectedClips,
              uniqueSourceAtlases:a.uniqueSourceAtlases,uniqueSourceDrawings:a.uniqueSourceDrawings,
              missingClipCount:a.missingClipCount,targetShortfalls:a.targetShortfalls?.length,
              findings:Object.fromEntries([...new Set(a.errors.map(e=>e.code))].map(k=>[k,a.errors.filter(e=>e.code===k).length]))
            };
          }else output.assetAudit={error:'No completed audit'};
          output.commandChecksPassed=keys.filter(k=>!['test','test-hydrated','test-hydrated2','test-hydrated3'].includes(k)).every(k=>exits[k]==='0')&&!output.assetAudit.error;
          output.unhydratedBaselineTestExit=exits.test;
          output.fixtureHydration=read('fixture-hydration.json')?JSON.parse(read('fixture-hydration.json')):{error:'Not completed'};
          output.fixtureHydrationSecond=read('fixture-hydration2.json')?JSON.parse(read('fixture-hydration2.json')):{error:'Not completed'};
          output.fixtureHydrationThird=read('fixture-hydration3.json')?JSON.parse(read('fixture-hydration3.json')):{error:'Not completed'};
          output.fixtureHydrationFourth=read('fixture-hydration4.json')?JSON.parse(read('fixture-hydration4.json')):{error:'Not completed'};
          fs.mkdirSync('ci-diagnostic',{recursive:true});
          fs.writeFileSync('ci-diagnostic/summary.json',JSON.stringify(output,null,2)+'\n');
          let md='## Broad runtime source and asset verification (NOT non-sparse)\n\n';
          md+='| Script | Exit status |\n| --- | --- |\n';
          for(const k of keys)md+='| '+k+' | '+exits[k]+' |\n';
          md+='\n### Audit provenance classifications\n\n~~~json\n'+JSON.stringify(output.assetAudit,null,2)+'\n~~~\n\n';
          md+='No production branch or PR source changed. A successful command is not equivalent to accepting inherited missing animation clips, and this workflow intentionally does not claim a full historical checkout.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          console.log(JSON.stringify(output,null,2));
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046

      - name: Upload complete test logs and generated source-asset audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marin-runtime-corpus-full-suite-provenance
          path: ci-diagnostic/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on any command errors without hiding audit status
        if: always()
        run: |
          test -f ci-diagnostic/summary.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('ci-diagnostic/summary.json','utf8'));
          if(!s.commandChecksPassed)process.exit(1);
          console.log('All scoped command checks passed after exact pinned fixture hydration; original incomplete baseline test still recorded. Full non-sparse checkout remains unverified.');
          console.log('Asset audit:',s.assetAudit.ok?'ok':'INCOMPLETE; preserve original findings');
          NODE
