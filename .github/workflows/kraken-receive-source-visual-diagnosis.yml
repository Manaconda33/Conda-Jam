name: Kraken receive original-source atlas evidence (read-only)
on:
  push:
    branches:
      - maintenance/pr6-pr7-reconciliation-probe
    paths:
      - '.github/workflows/kraken-receive-source-visual-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable original Kraken atlases and manifest
        uses: actions/checkout@v4
        with:
          ref: 55a2ab104d6b108cc08132afb958e75
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /public/assets/animation/kraken-receive-right.webp
            /public/assets/animation/kraken-idle-right.webp
            /public/assets/animation/kraken-idle-ball-right.webp
            /public/assets/animation/kraken-pass-right.webp
            /public/assets/animation/manifest.json
          sparse-checkout-cone-mode: false
      - name: Verify exact source bytes and export frame geometry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 55a2ab104d6b108cc08132afb958e75
          mkdir -p kraken-source-qa
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          const original='55a2ab104d6b108cc08132afb958e75';
          const m=JSON.parse(fs.readFileSync('public/assets/animation/manifest.json','utf8'));
          const athlete=m.characters.kraken,keys=['idle','idle-ball','receive','pass'],clips={};
          for(const key of keys){
            const clip=athlete?.directions?.right?.[key];
            if(!clip?.reviewed||!clip?.frames?.length)throw Error('Missing reviewed clip '+key);
            const p=clip.src.replace(/^\.\//,'');
            const bytes=fs.readFileSync(p);
            const sha=crypto.createHash('sha256').update(bytes).digest('hex');
            if(sha!==clip.sha256)throw Error('Original art SHA differs from accepted manifest '+key);
            const dest='kraken-source-qa/'+path.basename(p);
            fs.writeFileSync(dest,bytes);
            clips[key]={src:clip.src,sha256:sha,
              dimensions:[clip.columns,clip.rows],
              frames:clip.frames.map((x,i)=>({index:i,x:x.x,y:x.y,w:x.w,h:x.h,hash:x.hash??null})),
              baselineY:clip.baselineY??null,reviewed:clip.reviewed,
              originalProvenance:clip.provenance?.classification??null};
          }
          fs.writeFileSync('kraken-source-qa/frame-geometry.json',
            JSON.stringify({originalPR6:original,athlete:'kraken',scope:'original source atlas only, no sprite modification',clips},null,2)+'\n');
          console.log(JSON.stringify({source:original,hashes:Object.fromEntries(Object.entries(clips).map(([k,v])=>[k,v.sha256])),frames:Object.fromEntries(Object.entries(clips).map(([k,v])=>[k,v.frames.length]))},null,2));
          NODE
      - name: Upload complete original WebP art and verified frame metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-hash-verified-original-atlas-sources
          path: kraken-source-qa/
          if-no-files-found: error
          retention-days: 7
