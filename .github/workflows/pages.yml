name: Build and deploy Jamverse preview

on:
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - index.html
      - src/**
      - public/**
      - tools/build.mjs
      - package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - index.html
      - src/**
      - public/**
      - tools/build.mjs
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image tooling required by atlas tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
      - name: Run automated tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Validate roster content
        run: npm run validate:content
      - name: Simulate full league schedule
        run: npm run simulate:league
  build:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build self-contained preview
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
