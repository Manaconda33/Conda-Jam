name: Verify Captain Studio PRs

# Verification only. No build or GitHub Pages deployment in this workflow.
on:
  pull_request:
    paths:
      - '.github/workflows/captain-studio-verify.yml'
      - 'docs/superpowers/**'
      - 'tools/captain-studio/**'
      - 'tools/generate-art/studio/**'
      - 'tools/animation-assets.mjs'
      - 'tests/captain-studio-*.test.js'
      - 'tests/animation-audit.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captain-studio-verify-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install image tooling for atlas tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
      - name: Run automated tests, including Captain Studio when present
        run: npm test
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Validate roster content
        run: npm run validate:content
      - name: Simulate league schedule
        run: npm run simulate:league
