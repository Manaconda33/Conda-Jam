name: Marin saved-source regressions, bounce and live transitions (diagnostic only)

on:
  push:
    branches:
      - maintenance/pr6-pr7-reconciliation-probe
    paths:
      - '.github/workflows/marin-frame4-micro-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro-calibration:
    name: Combined regression plus bounce, no production writes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed main, sparse and blobless
        uses: actions/checkout@v4
        with:
          ref: 7e700c0eb392800794167007e076c51ac8357a77
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /.github/
            /index.html
            /package.json
            /package-lock.json
            /src/
            /public/
            /tests/
            /tools/*.mjs
            /tools/*.js
            /docs/animation-production/ASSET_AUDIT_LATEST.json
            /docs/animation-production/ASSET_AUDIT_LATEST.md
          sparse-checkout-cone-mode: false

      - name: Assemble original pinned PR6/PR7 checkout in runner only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          p6=55a2ab104d6b108cc08132fddc01b32afb958e75
          p7=97119d54fd24c442c15192a798cae1e8a279eb1d
          git config user.name 'GitHub CI diagnostic'
          git config user.email 'ci-local@example.invalid'
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/codex/captain-animation-completion:refs/remotes/origin/codex/captain-animation-completion' \
            '+refs/heads/codex/issue-7-seven-donor-supporting-reuse:refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse'
          test "$(git rev-parse HEAD)" = 7e700c0eb392800794167007e076c51ac8357a77
          test "$(git rev-parse refs/remotes/origin/codex/captain-animation-completion)" = "$p6"
          test "$(git rev-parse refs/remotes/origin/codex/issue-7-seven-donor-supporting-reuse)" = "$p7"
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const base='https://api.github.com/repos/Manaconda33/Conda-Jam';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const response=await fetch(base+'/pulls/7/files?per_page=100',{headers});
          if(!response.ok) throw Error('PR7 files unavailable: '+response.status);
          const files=await response.json();
          const selected=files.filter(f=>f.status!=='removed'&&/^(src\/|tools\/|tests\/|docs\/animation-production\/ASSET_)/.test(f.filename));
          if(selected.length!==14) throw Error('Unexpected PR7 changed source count '+selected.length);
          for(const file of selected) {
            const response=await fetch(base+'/git/blobs/'+file.sha,{headers});
            if(!response.ok)throw Error('Missing PR7 blob '+file.filename);
            const blob=await response.json();
            const bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
            const got=spawnSync('git',['hash-object','-w','--stdin'],{input:bytes,encoding:'utf8'});
            if(got.status!==0||got.stdout.trim()!==file.sha)throw Error('PR7 blob hash mismatch '+file.filename);
          }
          console.log('Hydrated all 14 pinned PR7 source/audit blobs');
          NODE
          git merge --quiet --no-edit --no-ff "$p6"
          set +e
          git merge --no-commit --no-ff "$p7"
          rc=$?
          set -e
          test "$rc" -eq 1
          git diff --name-only --diff-filter=U | sort > /tmp/marin-unmerged.txt
          expected=$(printf 'docs/animation-production/ASSET_AUDIT_LATEST.json\ndocs/animation-production/ASSET_AUDIT_LATEST.md\n')
          test "$(cat /tmp/marin-unmerged.txt)" = "$expected"
          git checkout --ours -- docs/animation-production/ASSET_AUDIT_LATEST.json docs/animation-production/ASSET_AUDIT_LATEST.md
          git add docs/animation-production/ASSET_AUDIT_LATEST.json docs/animation-production/ASSET_AUDIT_LATEST.md
          git commit -qm 'Ephemeral pinned integration only; generated audit excluded from acceptance'
          grep -q 'library.maskProfile,key' src/render/animation-sprites.js
          grep -q 'productionSpriteBaselineOffsetY' src/render/animation-sprites.js
          echo 'Only two known generated-audit conflicts; no remote code was altered.'

      - name: Install EXACT committed Marin candidate source in ephemeral combined checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # PR #7 does not modify animation.js. Abort rather than clobber a new integration change.
          test "$(git hash-object src/core/animation.js)" = d2540e37cc8cb635e3263a54f5794052fd8d6847
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync,readFileSync} from 'node:fs';
          // This is the exact source blob committed to the separate review-only branch.
          const sha='2b1413fce2582fd588f7df111bfb719e8605f046';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Versioned candidate blob unavailable: '+r.status);
          const blob=await r.json();
          const bytes=Buffer.from(blob.content.replace(/\\s/g,''),'base64');
          const verify=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(verify.status!==0||verify.stdout.trim()!==sha)throw Error('Committed candidate blob hash mismatch');
          const source=bytes.toString('utf8');
          if(!source.includes("donorId === 'juniper-vale'"))throw Error('Juniper-only guard missing');
          if(!source.includes("'dribble-run':{forward:[8,9,10,9,8,9,11,10,9,8,8]}"))throw Error('Frame 3/4/5 calibration missing');
          writeFileSync('src/core/animation.js',bytes);
          console.log('Ephemeral integration now uses exact committed review-branch candidate source '+sha);
          NODE
          test "$(git hash-object src/core/animation.js)" = 2b1413fce2582fd588f7df111bfb719e8605f046
          node --input-type=module <<'NODE'
          import {sampleBallForward,sampleBallHeight,athleteBallTrackSource} from './src/core/animation.js';
          import {supportingAnimationLibraries} from './src/content/supporting-animation-libraries.js';
          if(supportingAnimationLibraries['marin-dusk'].donorId!=='juniper-vale')throw Error('Visual donor changed');
          const actual=sampleBallForward('dribble-run',8,'marin-dusk');
          const height=sampleBallHeight('dribble-run',8,'marin-dusk');
          if(actual!==8)throw Error('Frame4 horizontal candidate not active: '+actual);
          const ticks=[4,5,6,7,8,9,10,11,12];
          const observed=ticks.map(t=>sampleBallForward('dribble-run',t,'marin-dusk'));
          const expected=[10,9.5,9,8.5,8,8.5,9,10,11];
          if(observed.some((v,i)=>Math.abs(v-expected[i])>1e-8))throw Error('Full bounce forward samples mismatch: '+observed);
          if(Math.abs(height-.25)>1e-9)throw Error('Bounce height unexpectedly changed: '+height);
          if(athleteBallTrackSource('marin-dusk','dribble-run','forward')!=='marin-dusk')throw Error('Own dribble track not retained');
          for(const clip of ['idle-ball','dribble','dribble-run','receive','pass']){
            if(athleteBallTrackSource('marin-dusk',clip,'forward')!=='marin-dusk')throw Error('Marin action not owned by Marin: '+clip);
          }
          console.log(JSON.stringify({visualDonor:'juniper-vale',clip:'dribble-run',tick:8,frame:4,originalControls:[11,12,12],previousScratchControls:[11,8,12],candidateControls:[9,8,9],bounceSamples:observed,bounceHeight:height}));
          NODE

      - name: Install browser test dependencies
        run: |
          npm ci
          python -m pip install --quiet playwright
          command -v google-chrome

      - name: Verify source-matched regression migration (runner local, no source changes)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The PR6-original test is retained on its protected branch. For this
          # combined local checkout, use exact source-versioned test corrections.
          test "$(git hash-object tests/animation.test.js)" = e09490c73e6f0facdb8f65253469c9f22de5f27b
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const sha='9456ffdcdf73f397c15a520b48f75a6cc91ca569';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Saved regression test unavailable: '+r.status);
          const blob=await r.json(),bytes=Buffer.from(blob.content.replace(/\s/g,''),'base64');
          const verify=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(verify.status!==0||verify.stdout.trim()!==sha)throw Error('Versioned regression test hash mismatch');
          const source=bytes.toString('utf8');
          if(!source.includes("const expectedForward=usesJuniper?6:1"))throw Error('Legacy donor expectation not retained');
          if(!source.includes("const expectedHeight=usesJuniper?1.05:1.45"))throw Error('Legacy ball height expectation not retained');
          if(!source.includes("Marin ball-track migration preserves the old donor"))throw Error('Calibration test missing');
          if(!source.includes("const expectedEchoHeight=[.85,.70,.55,.40,.25,.125,0,.125,.25]"))throw Error("Echo scaled-height assertion missing");
          writeFileSync('tests/animation.test.js',bytes);
          console.log('Pinned migration test source installed in ephemeral checkout');
          NODE
          test "$(git hash-object tests/animation.test.js)" = 9456ffdcdf73f397c15a520b48f75a6cc91ca569
          node --test --test-name-pattern="Marin ball-track migration|reviewed supporting athletes keep the separate game ball at their lead hand|Marin.s pass meets Kraken" \
            tests/animation.test.js tests/kraken-receive.integration.test.js
          echo '### Committed Marin regression migration (review-only)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Two historical donor-specific idle-ball assertions remain strict, with conditionally correct baselines.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Marin authored 9/8/9 bounce and Kraken real pass/catch tests executed against combined saved source.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Original PR6 test files, PR7, main, and production artifacts remain untouched.' >> "$GITHUB_STEP_SUMMARY"

      - name: Capture real-gameplay bounce in both facings and both zooms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/diagnostics
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const sha='0d2b891d6b0fa4f3d3c58e5be7962335627682ad';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Pinned harness unavailable '+r.status);
          const b=await r.json();const bytes=Buffer.from(b.content.replace(/\s/g,''),'base64');
          const v=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(v.status!==0||v.stdout.trim()!==sha)throw Error('Pinned harness content hash mismatch');
          writeFileSync('tools/diagnostics/marin-live-validation.py',bytes);
          NODE
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/diagnostics/marin-live-validation.py')
          s=p.read_text()
          swaps=[
            ('"dribble-run": {0, 1, 2, 3, 5, 7, 9}', '"dribble-run": {5, 6, 7, 8, 9, 10, 11, 12, 13}'),
            ('for scene in ["idle-ball", "dribble", "dribble-run", "pass-catch"]:','for scene in ["dribble-run"]:'),
            ('limit = 26 if scene == "pass-catch" else 25 if scene == "idle-ball" else 12','limit = 14'),
            ('if len(REPORT["runs"]) != 16:', 'if len(REPORT["runs"]) != 4:')
          ]
          for a,b in swaps:
            assert s.count(a)==1,('Unexpected harness source',a)
            s=s.replace(a,b)
          # Coordinated frame-3/4/5 forward changes only; full bounce at 100% and 120%, no sim/render edits.
          p.write_text(s)
          PY
          python -m py_compile tools/diagnostics/marin-live-validation.py
          python tools/diagnostics/marin-live-validation.py
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('tools/generate-art/previews/marin-live-pr6-pr7-scratch/report.json')
          data=json.loads(p.read_text())
          assert not data['errors']
          assert len(data['runs'])==4
          assert data['screenshotCount']==36
          for item in data['runs']:
            assert item['zoom'] in (100,120) and item['scenario']=='dribble-run'
            shots=item['screenshots']
            assert [shot['step'] for shot in shots]==list(range(5,14))
            frames=[item['frames'][i] for i in range(5,14)]
            assert [f['marin']['atlas']['frame'] for f in frames]==[2,2,3,3,4,4,5,5,6]
            assert all(f['marin']['atlas']['libraryId']=='juniper-vale' for f in frames)
            assert all(f['marin']['atlas']['production'] for f in frames)
            assert all(f['ball']['ownerId']=='marin-dusk' and f['ball']['mode']=='carried' for f in frames)
            assert all(abs(f['expectedHandMarin']['x']-f['ball']['x'])<1e-4 for f in frames)
            facing=item['setup']['facing']
            xs=[(f['ball']['x']-f['marin']['x'])*facing for f in frames]
            expected=[10,9.5,9,8.5,8,8.5,9,10,11]
            assert all(abs(a-b)<.001 for a,b in zip(xs,expected)),(facing,item['zoom'],xs)
            deltas=[round(xs[i+1]-xs[i],4) for i in range(len(xs)-1)]
            assert all(abs(d)<=1.01 for d in deltas),(facing,item['zoom'],deltas)
            heights=[f['ball']['z']-f['marin']['z'] for f in frames]
            expected_heights=[.85,.70,.55,.40,.25,.125,0,.125,.25]
            assert all(abs(a-b)<.001 for a,b in zip(heights,expected_heights)),(facing,item['zoom'],heights)
            print('Facing',facing,'zoom',item['zoom'],'forward',xs,'tick-deltas',deltas,'heights',heights)
          assert {(item['setup']['facing'],item['zoom']) for item in data['runs']}=={(1,100),(1,120),(-1,100),(-1,120)}
          print('Verified 36 game-driven screenshots covering entire bounce window, both facings/zooms.')
          PY
          {
            echo '## Marin frames 3–5 full-bounce scratch calibration (UNACCEPTED)'
            echo
            echo '- Exact pinned main, PR #6, PR #7 inputs verified on this runner.'
            echo '- Same Juniper visual donor, using the **exact committed review-branch source blob** (not regenerated scratch code).'
            echo '- Marin turbo-dribble forward: frame 3 **11 → 9**, frame 4 **12 → 8**, frame 5 **12 → 9** (source branch guard active).'
            echo '- No vertical bounce, other clip/athlete, original PR, or production reference modifications.'
            echo '- Captured actual simulation ticks 4–12, frames 2–6, both facings, at 100% and 120% zoom.'
            echo '- Machine continuity: max 1.01 horizontal world-unit per tick; bounce heights verified unchanged.'
            echo '- Review-only source code is now versioned on a separate branch; visual acceptance, nonsparse test suite, and integration approval remain outstanding.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate genuine live idle, dribble, turbo and Marin-to-Kraken catch (both facings and zooms)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Original native harness: 4 scenarios × 2 facings × 2 zooms, no fake freeze-frame contact.
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const sha='0d2b891d6b0fa4f3d3c58e5be7962335627682ad';
          const url='https://api.github.com/repos/Manaconda33/Conda-Jam/git/blobs/'+sha;
          const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw Error('Pinned original live-gameplay harness unavailable: '+response.status);
          const obj=await response.json();
          const bytes=Buffer.from(obj.content.replace(/\s/g,''),'base64');
          const hash=spawnSync('git',['hash-object','--stdin'],{input:bytes,encoding:'utf8'});
          if(hash.status!==0||hash.stdout.trim()!==sha)throw Error('Original gameplay harness hash mismatch');
          const src=bytes.toString('utf8');
          const before='OUT = ROOT / "tools/generate-art/previews/marin-live-pr6-pr7-scratch"';
          const after='OUT = ROOT / "tools/generate-art/previews/marin-committed-live-transition-review"';
          if(src.split(before).length!==2)throw Error('Original native harness layout changed');
          writeFileSync('tools/diagnostics/marin-full-transition-review.py',src.replace(before,after));
          NODE
          python -m py_compile tools/diagnostics/marin-full-transition-review.py
          python tools/diagnostics/marin-full-transition-review.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/generate-art/previews/marin-committed-live-transition-review/report.json')
          data=json.loads(p.read_text())
          assert not data['errors'],data['errors']
          assert len(data['runs'])==16,len(data['runs'])
          assert data['screenshotCount']==136,data['screenshotCount']
          expected={(f,z,s) for f in ('left','right') for z in (100,120)
                    for s in ('idle-ball','dribble','dribble-run','pass-catch')}
          actual={(r['facing'],r['zoom'],r['scenario']) for r in data['runs']}
          assert actual==expected,expected-actual
          catches=[r for r in data['runs'] if r['scenario']=='pass-catch']
          assert len(catches)==4
          assert all(r['catchStep']==10 for r in catches),[(r['facing'],r['zoom'],r.get('catchStep')) for r in catches]
          assert all(abs(r['catchDelta']['x'])<.02 and abs(r['catchDelta']['z'])<.01 for r in catches)
          assert all(
              f['marin']['atlas'] and f['marin']['atlas']['production']
              and f['marin']['atlas']['libraryId']=='juniper-vale'
              for r in data['runs'] for f in r['frames']
          )
          print('Complete native 16-scenario review: 136 images; real Kraken catches x4; no browser errors.')
          PY
          {
            echo '### Live gameplay transitions using saved Marin source/test'
            echo '- 16/16 completed native scenarios: idle-ball, normal dribble, turbo dribble, live pass/catch; both facings; 100%/120% zoom.'
            echo '- 136 game-driven registered-loader screenshots and zero recorded browser errors.'
            echo '- Kraken received all 4 genuine Marin passes with accepted x and z snap bounds.'
            echo '- Source and tests are pinned to versioned PR #16 blobs; integration still review-only.'
            echo '- Independent pixel-contact signoff and full non-sparse audit remain open.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native gameplay transition screenshots (not independent art signoff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marin-versioned-source-16-live-transitions
          path: tools/generate-art/previews/marin-committed-live-transition-review/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload 36 screenshots plus measurement report for independent visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marin-versioned-source-9-8-9-bounce-review
          path: tools/generate-art/previews/marin-live-pr6-pr7-scratch/
          if-no-files-found: warn
          retention-days: 7
